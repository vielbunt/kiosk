<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vielbunt Barraum-Kiosk 7 Jahre Queerbar</title>
<!--CSS-->
<style>
    /* 7 Jahre Queerbar: die ganze Show ist EIN vorgerendertes Video (Animationen, Uebergaenge, Laufband).
       Nur Preise und Ausverkauft kommen live aus dem Sheet als Overlay darueber. */
    body { background: #000; }
    #stage { display: block; }
    #v { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #ov { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; pointer-events: none; font-family: 'Cera Pro', sans-serif; }
    #ov .sl { position: absolute; inset: 0; opacity: 0; transition: opacity .3s ease-out; }
    #ov .sl.on { opacity: 1; }
    #ov div { position: absolute; }
    #ov .pr { font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; overflow: visible; }
    #ov .mk { background: rgba(0, 0, 0, .62); }
    #ov .mk.hide { background: #000; }
    #ov .st { background: #E6175F; }
</style>
</head>
<body class="dark">
<div id="stage"></div>
<script src="clips/manifest.js"></script>
<script src="clips/manifest.js"></script>
<script src="clips/7jahre/show.js"></script>
<!--SHEET-->
<!--LIB-->
<script>
(() => {
    const S = BK.S, el = BK.el;
    const MODE = '7-jahre-queerbar';
    const stage = document.getElementById('stage');
    const SHOW = window.BK_SHOW;

    if (!SHOW) {
        stage.appendChild(BK.msg('Die Show ist noch nicht gerendert.', 'barraum/deploy.sh --rendern 7jahre'));
        BK.watchMode(MODE, () => {});
        setTimeout(() => location.reload(), 60000);
        return;
    }

    const v = el('video');
    v.id = 'v';
    v.muted = true; v.autoplay = true; v.loop = true; v.playsInline = true;
    v.disableRemotePlayback = true;
    v.setAttribute('controlslist', 'noremoteplayback nodownload nofullscreen');
    v.src = 'clips/7jahre/show.mp4';
    // falls der Browser das Video anhaelt (Fehler, Speicher), wieder anstossen
    v.onerror = () => setTimeout(() => { v.load(); v.play().catch(() => {}); }, 5000);
    stage.appendChild(v);
    const ov = el('div');
    ov.id = 'ov';
    stage.appendChild(ov);
    v.play().catch(() => {});

    function layout() {
        const k = Math.min(innerWidth / SHOW.w, innerHeight / SHOW.h);
        ov.style.transform = `scale(${k})`;
        ov.style.left = (innerWidth - SHOW.w * k) / 2 + 'px';
        ov.style.top = (innerHeight - SHOW.h * k) / 2 + 'px';
    }
    layout();
    addEventListener('resize', layout);

    let set = S.settings(''), drinks = [];
    const fmtPrice = p => {
        const n = S.parseNum(p);
        if (n == null) return String(p || '');
        const s = n.toFixed(2).replace('.', ',');
        return set.euro ? s + ' €' : s;
    };
    const box = (parent, cls, r) => {
        const d = el('div', cls);
        d.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
        parent.appendChild(d);
        return d;
    };

    // Preise und Ausverkauft aus dem Sheet ueber die Lage legen, die beim Rendern gemessen wurde
    const groups = [];
    function buildOverlay() {
        ov.replaceChildren();
        groups.length = 0;
        for (const s of SHOW.slides) {
            if (!s.prices) continue;
            const g = el('div', 'sl');
            ov.appendChild(g);
            groups.push({ g, from: s.from, to: s.to });
            for (const e of s.prices) {
                const d = drinks.find(x => x.aktiv && (x.kat + '|' + x.name).toLowerCase() === e.key);
                // Getraenk inzwischen aus dem Sheet raus oder deaktiviert: Zeile abdecken
                if (!d) { box(g, 'mk hide', e.row); continue; }
                const text = d.out ? 'aus' : fmtPrice(d.preis);
                if (text) {
                    const p = box(g, 'pr', e.price);
                    p.textContent = text;
                    p.style.cssText += `;line-height:${e.price.h}px;font-size:${e.fs}px;color:${e.color};text-align:${e.foot ? 'left' : 'right'}`;
                }
                if (d.out) {
                    box(g, 'mk', e.row);
                    const l = box(g, 'st', { x: e.name.x, y: e.name.y + e.name.h * 0.52, w: e.name.w, h: Math.max(2, e.fs * 0.09) });
                    void l;
                }
            }
        }
        tick();
    }
    function tick() {
        const t = v.currentTime;
        for (const o of groups) o.g.classList.toggle('on', t >= o.from + 0.15 && t < o.to - 0.2);
    }
    setInterval(tick, 200);
    // zum Testen (nur mit BK_REPORT): verworfene Bilder melden
    setInterval(() => {
        const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
        if (q) BK.report('show=1&frames=' + q.totalVideoFrames + '&dropped=' + q.droppedVideoFrames + '&t=' + v.currentTime.toFixed(1));
    }, 30000);

    // zum Testen (nur mit BK_REPORT in clips/manifest.js): verworfene Bilder alle 5 Sekunden melden
    let lastDrop = 0, lastTotal = 0;
    setInterval(() => {
        const q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
        if (!q) return;
        BK.report('show=1&t=' + v.currentTime.toFixed(1) + '&frames=' + (q.totalVideoFrames - lastTotal) + '&dropped=' + (q.droppedVideoFrames - lastDrop));
        lastDrop = q.droppedVideoFrames; lastTotal = q.totalVideoFrames;
    }, 5000);

    BK.watchMode(MODE, s => { set = s; buildOverlay(); });
    // Preise und Ausverkauft: jede Minute
    BK.sheetLoop(['qdrinks'], ([d]) => { drinks = S.qdrinks(d); buildOverlay(); }, 60000);
})();
</script>
</body>
</html>
