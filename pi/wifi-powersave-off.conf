# /etc/NetworkManager/conf.d/wifi-powersave-off.conf auf dem Pi im Barraum (seit 27.11.2026)
# WLAN-Stromsparmodus aus. Mit Stromsparen ist die WLAN-Firmware des Pi Zero 2 W abgestuerzt
# ("brcmf_fw_crashed: Firmware has halted or crashed"), danach fehlte wlan0 komplett.
[connection]
wifi.powersave = 2
