<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="UTF-8">
<!-- Chrome soll keine Uebersetzung anbieten -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vielbunt Kiosk lite</title>
<!--RRULE-->
<style>
    /* Leichte Variante fuer den Pi Zero im Barraum: keine Animationen, keine Uebergaenge,
       immer nur ein Slide im DOM. Parameter wie im grossen Kiosk: dauer, uebersicht (Sekunden) */
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #DB3966;
        color: #fff;
        font-family: 'Cera Pro', sans-serif;
    }
    html, body, * { cursor: none !important; }

    #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .msg { font-size: 6vh; font-weight: bold; text-align: center; }
    .msg small { display: block; font-size: 3.2vh; font-weight: normal; margin-top: 2vh; opacity: .85; }

    /* Sharepics */
    .sharepics { display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100%; }
    .sharepics.single { justify-content: center; }
    .sharepics img { height: 100%; max-width: 50%; object-fit: contain; }
    .sharepics.single img { max-width: 100%; }

    /* Termine */
    .events { width: 88vw; height: 100%; box-sizing: border-box; padding: 4vh 0; display: flex; flex-direction: column; }
    .events h1 { font-size: 6vh; margin: 0 0 3vh; text-align: center; }
    .event-list { display: flex; flex-direction: column; gap: 1.4vh; }
    .event-item { display: flex; align-items: center; background: rgba(255, 255, 255, .15); padding: 1.6vh 2vw; border-radius: 1.5vh; }
    .event-date { font-size: 3.6vh; font-weight: bold; width: 18vw; flex-shrink: 0; padding-right: 2vw; margin-right: 2vw;
                  border-right: 2px solid rgba(255, 255, 255, .4); text-align: center; }
    .event-title { flex: 1; font-size: 3.6vh; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-time { font-size: 3vh; white-space: nowrap; opacity: .9; margin-left: 2vw; }

    video::-internal-media-controls-overlay-cast-button { display: none; }
    video { width: 100%; height: 100%; object-fit: contain; background: #DB3966; }
</style>
</head>
<body>
<!-- optionale Einstellungen neben der Datei, z. B. Clips; fehlt sie, laeuft alles wie gehabt -->
<script src="kiosk-config.js"></script>
<div id="stage"><div class="msg">Lade Inhalte...</div></div>

<script>
    const WP_API_URL = 'https://www.vielbunt.org/wp-json/wp/v2/posts';
    const ICS_URL = 'https://shy-recipe-d443.me-02a.workers.dev/';

    const Q = new URLSearchParams(location.search);
    const SLIDE_MS = (Number(Q.get('dauer')) || 20) * 1000;
    const OVERVIEW_MS = (Number(Q.get('uebersicht')) || 30) * 1000;
    const REFRESH_MS = 30 * 60 * 1000;
    const RETRY_MS = 60 * 1000;
    const MAX_EVENTS = 8;
    const LOOKAHEAD_DAYS = 90;
    // optionale vorgerenderte Clips, z. B. ?clips=clips/skyline.mp4,clips/flaggen.mp4
    // nach jeder Terminuebersicht kommt einer davon, reihum
    // oder in kiosk-config.js: window.KIOSK_CONFIG = { clips: ['clips/skyline-pink.mp4'] }
    const CFG = window.KIOSK_CONFIG || {};
    const CLIPS = Q.has('clips') ? Q.get('clips').split(',').map(s => s.trim()).filter(Boolean) : (CFG.clips || []);
    // nur die Terminuebersicht, wie ?events_only im grossen Kiosk
    const EVENTS_ONLY = Q.has('events_only') || Q.get('mode') === 'events';
    const CACHE_KEY = 'vielbunt_kiosk_lite';

    const stage = document.getElementById('stage');
    let data = null;            // { posts: [...], events: [...], ts }
    let playlist = [];
    let pos = 0, clipIdx = 0, timer = null;

    // ---------- Laden ----------

    async function fetchWithTimeout(url, ms = 30000) {
        const ctrl = new AbortController();
        const id = setTimeout(() => ctrl.abort(), ms);
        try {
            const res = await fetch(url, { signal: ctrl.signal });
            if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + url);
            return res;
        } finally {
            clearTimeout(id);
        }
    }

    // aus dem srcset die kleinste Version nehmen, die fuer die Bildschirmhoehe noch reicht
    function pickSrc(img) {
        const w = +img.getAttribute('width'), h = +img.getAttribute('height');
        const need = w && h ? innerHeight * w / h : innerWidth / 2;
        const cands = (img.getAttribute('srcset') || '').split(',')
            .map(s => s.trim().split(/\s+/))
            .map(([url, size]) => ({ url, w: parseInt(size, 10) }))
            .filter(c => c.url && c.w)
            .sort((a, b) => a.w - b.w);
        const hit = cands.find(c => c.w >= need);
        return hit ? hit.url : img.getAttribute('src');
    }

    async function fetchPosts() {
        const today = new Date();
        const since = new Date(today.getTime() - 21 * 864e5).toISOString();
        const res = await fetchWithTimeout(`${WP_API_URL}?after=${since}&per_page=100&_fields=title,content`);
        const posts = await res.json();
        const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const out = [];
        const dateRegex = /(\d{2})\.(\d{2})\.(?:(\d{4}))?(?:\s*[–—-]\s*(\d{2})\.(\d{2})\.(?:(\d{4}))?)?/;

        for (const post of posts) {
            const title = post.title?.rendered || '';
            if (/abgesagt/i.test(title)) continue;
            let sortDate = 0;
            const m = title.match(dateRegex);
            if (m) {
                const day = +(m[4] || m[1]), month = +(m[5] || m[2]) - 1;
                let year = +(m[6] || m[3]) || today.getFullYear();
                if (!(m[6] || m[3]) && (startOfToday - new Date(year, month, day)) / 864e5 > 180) year++;
                const d = new Date(year, month, day);
                if (d < startOfToday) continue; // schon vorbei
                sortDate = d.getTime();
            }
            const doc = new DOMParser().parseFromString(post.content.rendered, 'text/html');
            const imgs = Array.from(doc.querySelectorAll('img')).map(pickSrc).filter(Boolean);
            if (!imgs.length) continue;
            out.push({ images: imgs.length === 1 ? [imgs[0]] : [imgs[0], imgs[imgs.length - 1]], sortDate });
        }
        return out.sort((a, b) => a.sortDate - b.sortDate);
    }

    function parseICSDate(s) {
        if (!s) return null;
        const y = +s.substr(0, 4), m = +s.substr(4, 2) - 1, d = +s.substr(6, 2);
        if (s.length === 8) return new Date(y, m, d);
        const h = +s.substr(9, 2) || 0, mi = +s.substr(11, 2) || 0, se = +s.substr(13, 2) || 0;
        return s.endsWith('Z') ? new Date(Date.UTC(y, m, d, h, mi, se)) : new Date(y, m, d, h, mi, se);
    }
    const unescapeICS = s => (s || '').replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').trim();

    // gleiche Logik wie vielbunt.org/kiosk.html, nur mit kuerzerem Zeitfenster (spart dem Pi Rechenzeit)
    function parseICS(text) {
        const lines = text.replace(/\r?\n[ \t]/g, '').split(/\r?\n/);
        const all = [];
        let cur = null;
        for (const line of lines) {
            if (line.startsWith('BEGIN:VEVENT')) cur = {};
            else if (line.startsWith('END:VEVENT')) { if (cur) all.push(cur); cur = null; }
            else if (cur) {
                const v = line.slice(line.indexOf(':') + 1);
                if (line.startsWith('SUMMARY')) cur.summary = unescapeICS(v);
                else if (line.startsWith('DTSTART')) { cur.start = parseICSDate(v); cur.tz = line.includes('TZID'); }
                else if (line.startsWith('DTEND')) cur.end = parseICSDate(v);
                else if (line.startsWith('RRULE:')) cur.rrule = v;
                else if (line.startsWith('EXDATE')) (cur.ex = cur.ex || []).push(...v.split(',').map(d => parseICSDate(d).getTime()));
                else if (line.startsWith('CLASS:')) cur.cls = v.trim();
                else if (line.startsWith('UID:')) cur.uid = v.trim();
                else if (line.startsWith('RECURRENCE-ID')) cur.recId = parseICSDate(v);
            }
        }

        const moved = {};
        for (const e of all) if (e.recId && e.uid) (moved[e.uid] = moved[e.uid] || []).push(e.recId.getTime());

        const now = new Date();
        const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const until = new Date(day0.getTime() + LOOKAHEAD_DAYS * 864e5);
        const out = [];

        for (const e of all) {
            if (!e.start) continue;
            const cls = (e.cls || 'PUBLIC').toUpperCase();
            if (cls === 'PRIVATE' || cls === 'CONFIDENTIAL') continue;
            // interne Termine (Auf-/Abbau, intern, Blocker, Klausur, abgesagt ...) filtert schon der Worker (worker/filter.js)
            if (!e.rrule) {
                if (e.start >= day0 && e.start <= until && !(e.ex && e.ex.includes(e.start.getTime())))
                    out.push({ summary: e.summary, start: e.start });
                continue;
            }
            // Serien, die schon zu Ende sind, gar nicht erst durchrechnen
            const u = e.rrule.match(/UNTIL=(\d{8})/);
            if (u && parseICSDate(u[1]) < day0) continue;
            if (!window.rrule) continue;
            try {
                const s = e.start;
                // rrule rechnet in UTC, Ortszeit deshalb als "naive UTC" durchreichen (wie im Kiosk)
                const dt = e.tz ? new Date(Date.UTC(s.getFullYear(), s.getMonth(), s.getDate(), s.getHours(), s.getMinutes(), s.getSeconds())) : s;
                const skip = (e.uid && moved[e.uid]) || [];
                for (const n of rrule.rrulestr(e.rrule, { dtstart: dt }).between(day0, until, true)) {
                    const d = e.tz ? new Date(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), n.getUTCHours(), n.getUTCMinutes(), n.getUTCSeconds()) : n;
                    const t = d.getTime();
                    if ((e.ex && e.ex.includes(t)) || skip.includes(t)) continue;
                    out.push({ summary: e.summary, start: d });
                }
            } catch (err) {
                console.error('RRULE kaputt', e.rrule, err);
            }
        }
        return out.sort((a, b) => a.start - b.start).slice(0, MAX_EVENTS);
    }

    async function fetchEvents() {
        const res = await fetchWithTimeout(ICS_URL);
        const text = await res.text();
        if (!text.includes('BEGIN:VCALENDAR')) throw new Error('kein Kalender');
        return parseICS(text);
    }

    function saveCache(d) {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) { /* egal */ }
    }
    function loadCache() {
        try {
            const d = JSON.parse(localStorage.getItem(CACHE_KEY));
            if (!d) return null;
            d.events.forEach(e => { e.start = new Date(e.start); });
            return d;
        } catch (e) { return null; }
    }

    async function refresh() {
        // Posts und Termine getrennt: faellt eins aus, bleibt das andere trotzdem aktuell
        const [p, e] = await Promise.allSettled([fetchPosts(), fetchEvents()]);
        if (p.status === 'rejected') console.warn('Posts:', p.reason);
        if (e.status === 'rejected') console.warn('Termine:', e.reason);
        if (p.status === 'rejected' && e.status === 'rejected') return false;
        data = {
            posts: p.status === 'fulfilled' ? p.value : (data ? data.posts : []),
            events: e.status === 'fulfilled' ? e.value : (data ? data.events : []),
            ts: Date.now()
        };
        saveCache(data);
        buildPlaylist();
        return true;
    }

    // ---------- Ablauf ----------

    // zwei Sharepics, dann die Terminuebersicht (und danach ggf. ein Clip)
    function buildPlaylist() {
        const now = new Date();
        const events = data.events.filter(e => e.start >= new Date(now.getFullYear(), now.getMonth(), now.getDate()));
        const list = [];
        if (!EVENTS_ONLY) data.posts.forEach((p, i) => {
            list.push({ kind: 'pics', images: p.images });
            if (i % 2 === 1 && events.length) list.push({ kind: 'events' });
        });
        if (events.length && (!list.length || list[list.length - 1].kind !== 'events')) list.push({ kind: 'events' });
        if (CLIPS.length) {
            const withClips = [];
            for (const item of list) {
                withClips.push(item);
                if (item.kind === 'events') withClips.push({ kind: 'clip' });
            }
            playlist = withClips;
        } else {
            playlist = list;
        }
        if (pos >= playlist.length) pos = 0;
    }

    function preload(urls, ms = 8000) {
        return Promise.all(urls.map(url => new Promise(resolve => {
            const img = new Image();
            const done = () => resolve();
            img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(done);
            img.onerror = done;
            setTimeout(done, ms);
            img.src = url;
        })));
    }

    function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
    }

    const fmtDate = d => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const fmtTime = d => d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

    function renderEvents() {
        const now = new Date();
        const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const wrap = el('div', 'events');
        wrap.appendChild(el('h1', null, 'Nächste Termine von vielbunt:'));
        const list = el('div', 'event-list');
        for (const e of data.events.filter(e => e.start >= day0)) {
            const item = el('div', 'event-item');
            item.appendChild(el('div', 'event-date', fmtDate(e.start)));
            item.appendChild(el('div', 'event-title', e.summary || 'Termin'));
            const allDay = e.start.getHours() === 0 && e.start.getMinutes() === 0;
            item.appendChild(el('div', 'event-time', allDay ? 'Ganztägig' : fmtTime(e.start) + ' Uhr'));
            list.appendChild(item);
        }
        wrap.appendChild(list);
        return wrap;
    }

    function show(node) {
        stage.replaceChildren(node);
    }

    function message(text, sub) {
        const m = el('div', 'msg', text);
        if (sub) m.appendChild(el('small', null, sub));
        show(m);
    }

    async function step() {
        clearTimeout(timer);
        if (!playlist.length) {
            message('Gerade keine Termine.', 'Mehr auf vielbunt.org');
            timer = setTimeout(step, SLIDE_MS);
            return;
        }
        const item = playlist[pos];
        pos = (pos + 1) % playlist.length;

        if (item.kind === 'pics') {
            await preload(item.images);
            const wrap = el('div', 'sharepics' + (item.images.length === 1 ? ' single' : ''));
            for (const src of item.images) {
                const img = el('img');
                img.src = src;
                wrap.appendChild(img);
            }
            show(wrap);
            timer = setTimeout(step, SLIDE_MS);
        } else if (item.kind === 'events') {
            show(renderEvents());
            timer = setTimeout(step, OVERVIEW_MS);
        } else if (item.kind === 'clip') {
            const v = el('video');
            v.muted = true;
            v.autoplay = true;
            v.playsInline = true;
            // kein Cast-Symbol oben links
            v.disableRemotePlayback = true;
            v.setAttribute('controlslist', 'noremoteplayback nodownload nofullscreen');
            v.src = CLIPS[clipIdx++ % CLIPS.length];
            v.onended = v.onerror = () => {
                // zum Testen: abgespielte und verworfene Bilder an einen lokalen Log-Server melden
                if (CFG.report && v.getVideoPlaybackQuality) {
                    const pq = v.getVideoPlaybackQuality();
                    new Image().src = CFG.report + '?clip=' + encodeURIComponent(v.src.split('/').pop()) +
                        '&frames=' + pq.totalVideoFrames + '&dropped=' + pq.droppedVideoFrames + '&t=' + Date.now();
                }
                step();
            };
            show(v);
            timer = setTimeout(step, 90000); // falls ein Clip haengt
        }
    }

    async function start() {
        data = loadCache();
        if (data) buildPlaylist();
        let ok = false;
        try { ok = await refresh(); } catch (e) { console.warn(e); }
        if (!ok && !data) {
            message('Keine Verbindung zum Server.', 'Neuer Versuch in einer Minute ...');
            setTimeout(start, RETRY_MS);
            return;
        }
        step();
        // spaeter still im Hintergrund aktualisieren, bei Fehlern einfach die alten Daten weiterzeigen
        setInterval(() => refresh().catch(e => console.warn(e)), REFRESH_MS);
    }

    document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') step(); });
    start();
</script>
</body>
</html>
